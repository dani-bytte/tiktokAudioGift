name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        name: Calculate next patch version
        shell: bash
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

          if [ -z "$latest_tag" ]; then
            next_version="1.0.1"
          else
            current_version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$current_version"
            next_version="${major}.${minor}.$((patch + 1))"
          fi

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-release
          - os: windows-latest
            artifact_name: windows-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Set build version
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version

      - name: Build app
        shell: bash
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ needs.prepare.outputs.version }}/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: "*-release"
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        run: |
          if gh release view "${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${{ needs.prepare.outputs.tag }}" artifacts/* \
            --title "${{ needs.prepare.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --generate-notes
